services:
  # ==========================================
  # DATABASE - MongoDB
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: gdash-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gdash-weather
    volumes:
      - mongodb_data:/data/db
    networks:
      - gdash-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MESSAGE BROKER - RabbitMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gdash-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"  
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gdash-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND API - NestJS
  # ==========================================
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: gdash-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/gdash-weather}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gdash.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - ../../services/api/src:/app/src
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gdash-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # PYTHON COLLECTOR
  # ==========================================
  collector:
    build:
      context: ../../services/collector
      dockerfile: Dockerfile
    container_name: gdash-collector
    restart: unless-stopped
    environment:
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL:-60}
      LATITUDE: ${LATITUDE:--12.9714}
      LONGITUDE: ${LONGITUDE:--38.5014}
      LOCATION_NAME: ${LOCATION_NAME:-Salvador, BA}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-weather-data}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-weather-exchange}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-weather.data}
    volumes:
      - ../../services/collector/src:/app/src
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - gdash-network

  # ==========================================
  # GO WORKER
  # ==========================================
  worker:
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    container_name: gdash-worker
    restart: unless-stopped
    environment:
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      WORKER_RETRY_ATTEMPTS: ${WORKER_RETRY_ATTEMPTS:-3}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-5}
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-weather-data}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - gdash-network

  # ==========================================
  # FRONTEND - React + Vite
  # ==========================================
  web:
    build:
      context: ../../services/web
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: gdash-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-GDASH Weather Insights}
    volumes:
      - ../../services/web/src:/app/src
      - ../../services/web/.env:/app/.env
      - /app/node_modules
    depends_on:
      - api
    networks:
      - gdash-network

# ==========================================
# NETWORKS
# ==========================================
networks:
  gdash-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
